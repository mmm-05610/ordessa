[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-workspace"
version = "2.0.0a1"
description = "Ordessa Workspace domain plugin: workspace records, environment authority"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ordessa-execution-agents==0.1.0",
    "ordessa-interfaces==0.1.0",
    "ordessa-infrastructure==0.1.0",
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
