[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-extensions"
version = "1.0.0a1"
description = "Ordessa executable-extensions domain: hook definitions, mandatory approval chain, hashed/pinned content, brand projection"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "ordessa-server-plugin-api>=0.1.0,<1",
    # Execution owns the Harness declaration types consumed by these adapters.
    "ordessa-agents==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
