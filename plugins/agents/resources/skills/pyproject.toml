[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-skills"
version = "2.0.0a1"
description = "Ordessa Skills domain: versioned skill content, bounded import, auditable projection"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # Skills consumes the canonical tree identity implementation and storage contract.
    "ordessa-execution-agents==0.1.0",
    "ordessa-interfaces==0.1.0",
    "ordessa-permissions-api==0.1.0",
    "PyYAML>=6,<7",
    "ordessa-server-plugin-api>=0.1.0,<1",
    # The published Harness v2 contract (docs/implementation/specifications/011-plugin-rollout/checkpoints/
    # harness-api.json): the DTO surface the skills configuration adapters
    # implement and register against.
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
