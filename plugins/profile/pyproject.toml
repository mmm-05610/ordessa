[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-profile"
version = "2.0.0a1"
description = "Ordessa Profile plugin family: per-Harness profiles, contributed facets, session overlays and same-session switching"
requires-python = ">=3.10"
license = {text = "MIT"}
# Public plugin contracts only; no host implementation dependency.
dependencies = ["pacthold==2.0.0a1", "ordessa-server-plugin-api>=0.1.0,<1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."agent_box.plugins"]
profile = "ordessa_profile.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
