[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-decision-jev"
version = "0.1.0"
description = "Jev finite-decision provider adapter with explicit host configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["decision-runtime==0.1.0", "typesafe-sdk==0.7.2", "httpx2==2.13.1", "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
