[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-decision-rules-cel"
version = "0.1.0"
description = "Bounded CEL-subset rules engine plugin for decision jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["decision-runtime>=0.2.0", "cel-python"]

[project.entry-points."ordessa.decision.rules"]
cel = "ordessa_decision_rules_cel.engine:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
