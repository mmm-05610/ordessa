[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-permissions-api"
version = "0.1.0"
description = "Ordessa Permissions domain contract: typed rules, non-widenable ceilings, adjudication synthesis"
requires-python = ">=3.10"
license = {text = "MIT"}
# Zero product dependencies by design: this is the pure domain layer the
# Permissions backend, adapters and consumers all import. Nothing here may
# reach a host, a storage engine or a Harness.
dependencies = []
keywords = ["ordessa", "permissions", "policy", "ceiling", "approval"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_permissions_api = ["py.typed"]
