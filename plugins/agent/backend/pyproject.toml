[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-agent"
version = "0.1.0"
description = "Agent domain: the single owner of logical sessions/config/submissions (A1, spec 026/010)"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["ordessa-server-plugin-api>=0.1.0,<1", "ordessa-environment-api"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
