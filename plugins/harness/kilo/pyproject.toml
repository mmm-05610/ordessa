[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-kilo"
version = "0.1.0a1"
description = "Independent kilo brand provider facts for the Ordessa harness group"
requires-python = ">=3.10"
dependencies = ["ordessa-execution-agents==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_harness_kilo = ["deployment/*", "_registration_declarations/*.toml", "_registration_declarations/*.json", "acp/launch_kilo.json", "acp/launch_kilo.mjs"]
