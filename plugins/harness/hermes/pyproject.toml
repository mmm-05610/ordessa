[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-hermes"
version = "0.1.0a1"
description = "Independent hermes brand provider facts for the Ordessa harness group"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3", "ordessa-execution-agents==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_harness_hermes = ["deployment/*", "_registration_declarations/*.toml", "_registration_declarations/*.json", "acp/launch_hermes.json", "acp/launch_hermes.mjs"]
