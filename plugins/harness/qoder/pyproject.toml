[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-qoder"
version = "0.1.0a1"
description = "Independent qoder brand provider facts for the Ordessa harness group"
requires-python = ">=3.10"
dependencies = ["ordessa-execution-agents==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ordessa.harness_providers"]
qoder = "ordessa_harness_qoder:factory"
