[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "ordessa-harness-codex"
version = "0.1.0a1"
description = "Independently activated Codex app-server AgentUnit provider"
requires-python = ">=3.10"
[project.optional-dependencies]
server = ["ordessa-server-plugin-api>=0.1.0,<1"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
