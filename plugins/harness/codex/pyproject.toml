[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "ordessa-harness-codex"
version = "0.1.0a1"
description = "SDK-only Codex app-server preparation provider"
requires-python = ">=3.10"
dependencies = ["ordessa-execution-agents==0.1.0"]


[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ordessa_harness_codex = ["deployment/*", "*.toml", "_registration_declarations/*.toml", "_registration_declarations/*.json", "acp/launch_codex.json", "acp/launch_codex.mjs", "acp/vendor/LICENSE", "acp/vendor/PATCHES.md", "acp/vendor/SOURCE.json", "acp/vendor/codex-session-history.js", "acp/profile/bridge.mjs", "acp/profile/codex-generic-prompt.LICENSE", "acp/profile/codex-generic-prompt.NOTICE", "acp/profile/codex-generic-prompt.md", "acp/profile/codex-model-catalog-provenance.md", "acp/profile/codex-model-catalog.mjs", "acp/profile/codex-process.mjs", "acp/profile/configuration-query.mjs", "acp/profile/entry.mjs", "acp/profile/routing.mjs", "acp/profile/strategy.mjs"]

[project.entry-points."ordessa.harness_providers"]
codex = "ordessa_harness_codex.provider:factory"
