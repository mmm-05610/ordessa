[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-pi"
version = "0.1.0a1"
description = "SDK-only Pi native RPC preparation provider"
requires-python = ">=3.12"

dependencies = ["ordessa-execution-agents==0.1.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ordessa_harness_pi = ["deployment/*", "_registration_declarations/*.toml", "_registration_declarations/*.json", "acp/vendor/LICENSE", "acp/vendor/PATCHES.md", "acp/vendor/SOURCE.json", "acp/vendor/backward-line-scan.js", "acp/vendor/pi-session-history.js", "acp/profile/configuration-query.mjs", "acp/profile/creation.mjs", "acp/profile/entry.mjs", "acp/profile/provider-registration.mjs", "acp/profile/server.mjs"]

[project.entry-points."ordessa.harness_providers"]
pi = "ordessa_harness_pi.provider:factory"
