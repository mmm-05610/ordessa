[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-pi"
version = "0.1.0a1"
description = "Independent Pi native RPC AgentUnit provider"
requires-python = ">=3.10"

[project.optional-dependencies]
server = ["ordessa-server-plugin-api>=0.1.0,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
