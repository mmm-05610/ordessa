[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-kimi"
version = "0.1.0a1"
description = "Independent kimi brand provider facts for the Ordessa harness group"
requires-python = ">=3.10"
dependencies = ["pacthold", "ordessa-harness-transport"]

[tool.setuptools.packages.find]
where = ["src"]
