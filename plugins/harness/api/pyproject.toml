[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-api"
version = "1.0.0a1"
description = "Standalone typed contracts for Ordessa Harness adapters"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_harness_api = ["py.typed"]
