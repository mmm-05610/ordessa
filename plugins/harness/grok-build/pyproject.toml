[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "ordessa-harness-grok-build"
version = "0.1.0a1"
description = "Independently activated xAI Grok Build Harness SDK provider"
requires-python = ">=3.10"
dependencies = ["ordessa-execution-agents==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ordessa_harness_grok_build = ["_registration_declarations/*.toml", "_registration_declarations/*.json", "acp/launch_grok_build.json", "acp/launch_grok_build.mjs"]

[project.entry-points."ordessa.harness_providers"]
grok-build = "ordessa_harness_grok_build:factory"
