[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-qwen"
version = "0.1.0a1"
description = "Independent qwen brand provider facts for the Ordessa harness group"
requires-python = ">=3.10"
dependencies = ["ordessa-execution-agents==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_harness_qwen = ["deployment/*", "acp/launch_qwen.json", "acp/launch_qwen.mjs"]

[project.entry-points."ordessa.harness_providers"]
qwen = "ordessa_harness_qwen:factory"
