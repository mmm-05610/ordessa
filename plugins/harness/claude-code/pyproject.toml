[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-claude-code"
version = "0.1.0a1"
description = "Independent Claude Code AgentUnit provider and explicit native SDK adapter"
requires-python = ">=3.10"
dependencies = ["pacthold>=0.1.0", "ordessa-harness-transport>=0.1.0a1"]

[project.optional-dependencies]
server = ["ordessa-server-plugin-api>=0.1.0,<1"]
sdk = ["claude-agent-sdk==0.2.163"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
