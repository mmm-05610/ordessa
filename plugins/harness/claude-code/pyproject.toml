[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-harness-claude-code"
version = "0.1.0a1"
description = "Claude Code native facts and pure pinned Agent harness SDK provider"
requires-python = ">=3.10"

dependencies = ["ordessa-execution-agents==0.1.0"]

[project.entry-points."ordessa.harness_providers"]
claude = "ordessa_harness_claude_code.client:factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ordessa_harness_claude_code = ["deployment/*", "acp/launch_claude.json", "acp/launch_claude.mjs", "acp/launch_claude_code.json", "acp/launch_claude_code.mjs", "acp/profile/bridge.mjs", "acp/profile/claude-auth.mjs", "acp/profile/claude-provider-model.mjs", "acp/profile/configuration-query.mjs", "acp/profile/entry.mjs", "acp/profile/routing.mjs", "acp/profile/strategy.mjs"]
