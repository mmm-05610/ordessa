schema_version = 1

[[harness]]
schema_version = 1
driver = "codex"
# 静态候选（产品层声明上限），**不是**观测结论：Codex 生产封装已在树（
# `codex/production.py`＋`codex-production-chain-gate.py` 全链门，离线与真实模型
# 预检均已通过，见 docs/server-round1/fullstack/codex-production-packaging.md 与
# live-model-preflight.md §6 Codex）；本段 observed 仍逐项留空——门证据尚未被吸收
# 为 workbench 逐项声明。
# 逐项证据见 plugins/agent-box-harnesses/tests/test_capability_declarations.py 的
# FAMILY_MATRIX。
capabilities = ["start", "observe", "finish", "attach", "stream", "permissions", "native_continuation"]
[harness.identity]
harness_type = "codex"
display_name = "Codex"
description = "OpenAI Codex Harness"
version = "2.0"
[harness.executable]
identity = "codex"
resolver_kind = "PATH_OR_BUNDLE"
bundle_members = ["codex", "codex-app-server"]
version_probe = ["--version"]
[harness.profile]
native_home = ".codex"
guest_home = "/runtime/home"
config_format = "json-or-toml"
payload_schema = "codex-profile-v1"
codec = "codex"
overlay_policy = "execution-local"
slots = ["provider", "permission", "instruction", "mcp", "skill", "hooks"]
skill_target = "/runtime/home/skills/{skill_id}"
skill_env = "CODEX_HOME"
# Order 58 stage A (first-hand): the pinned codex binary declares `mcp_servers`
# in $CODEX_HOME/config.toml (34 occurrences of the key in 0.147.0).
mcp_target = "/runtime/home/.codex/config.toml"
mcp_key = "mcp_servers"
# Order 59 stage A (first-hand): codex reads `hooks/hooks.json` with the
# same event names as claude (SessionStart…SubagentStop, hook_event_name).
hooks_target = "/runtime/home/.codex/hooks/hooks.json"
# Order 63 stage A (first-hand): the pinned binary names
# `memories/MEMORY.md` and `memories/memory_summary.md`, i.e. under
# $CODEX_HOME/memories/.
memory_paths = [".codex/memories/MEMORY.md", ".codex/memories/memory_summary.md"]
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "interactive"
argv = ["codex"]
io = "pty"
[[harness.launch_modes]]
name = "exec"
argv = ["codex", "exec"]
io = "stdio"
[[harness.launch_modes]]
name = "app-server"
argv = ["codex", "app-server"]
io = "stdio"
[harness.runtime]
io = "stdio"
host_capabilities = ["runtime-composition"]
sandbox_capabilities = ["projection"]
network = "required"
terminal = "stdio-or-pty"
[harness.continuation]
kind = "native_session"
contract_id = "agent-box.codex-continuation@1"
target_provider = "codex-continuation"
[harness.credential]
contract = "agent-box.credential@1"
locator_provider = "codex-login"
guest_target_class = "secret-mount"
materializer = "codex-login"

[[harness]]
schema_version = 1
driver = "claude"
# Work Order 43 生产化更新：此前是纯静态预声明；现在有生产封装与官方 ACP 适配器
# （@agentclientprotocol/claude-agent-acp，Apache-2.0；内嵌 Anthropic 专有 SDK 与
# 平台二进制，许可边界记录在 claude-production-packaging.md）。`attach` 被移除：
# 真实握手播发的 promptCapabilities 为空，没有任何附件投递证据（诚实规则）；`stream`
# 加入：适配器播发并实测 agent_message_chunk 流式更新。逐项证据见 FAMILY_MATRIX。
capabilities = ["start", "observe", "finish", "stream", "native_continuation"]
[harness.identity]
harness_type = "claude-code"
display_name = "Claude Code"
description = "Anthropic Claude Code Harness (official ACP adapter)"
version = "0.81.2"
[harness.executable]
identity = "claude"
resolver_kind = "PATH_OR_BUNDLE"
bundle_members = ["claude"]
version_probe = ["--version"]
[harness.profile]
native_home = ".claude"
guest_home = "/runtime/home"
config_format = "json"
payload_schema = "claude-code-profile-v1"
codec = "claude"
overlay_policy = "execution-local"
slots = ["provider", "instruction", "mcp", "skill", "hooks"]
# Order 58 stage A (first-hand): `.claude/skills` (52 refs), `mcpServers` in
# settings.json (100 refs).
skill_target = "/runtime/home/.claude/skills/{skill_id}"
# Order 086 stage 1 (first-hand, CLI 2.1.274): an MCP server declared in
# settings.json never reaches the model request's `tools` array; declared in
# `$CLAUDE_CONFIG_DIR/.claude.json` it does (and with neither file, not). The
# project `.mcp.json` also works but the workspace belongs to the user.
mcp_target = "/runtime/home/.claude/.claude.json"
mcp_key = "mcpServers"
# Order 59 stage A (first-hand): claude declares hooks in settings.json
# (PreToolUse 108 refs, disableAllHooks 30).
hooks_target = "/runtime/home/.claude/settings.json"
hooks_key = "hooks"
# Order 63 stage A (first-hand): `.claude/CLAUDE.md` (17 refs) is the
# user-level memory/instruction file the harness itself writes and reads.
memory_paths = [".claude/CLAUDE.md"]
[[harness.launch_modes]]
name = "acp"
argv = ["claude-agent-acp"]
io = "stdio"
[harness.runtime]
io = "stdio"
network = "required"
terminal = "stdio"
[harness.continuation]
kind = "native_session"
contract_id = "agent-box.claude-continuation@1"
target_provider = "claude-code-continuation"

[[harness]]
schema_version = 1
driver = "opencode"
# 逐项证据见 plugins/agent-box-harnesses/tests/test_capability_declarations.py 的
# FAMILY_MATRIX：真实单文件二进制全链门的重开相位 `createsInsideReopenPhase=[]`、
# `hostStarts>=2`、同一 native session id，且第二轮上下文来自 OpenCode 自己的 SQLite
# 存储，因此 `native_continuation` 是已观测项。`attach` 刻意不声明：驱动在发包前以
# `OPENCODE_ATTACHMENTS_UNSUPPORTED` 显式拒绝附件，native `promptCapabilities.image`
# 也是 false；`permissions` 无任何运行时证据。
capabilities = ["start", "observe", "finish", "stream", "native_continuation"]
[harness.identity]
harness_type = "opencode"
display_name = "OpenCode"
description = "OpenCode Harness"
version = "2.0"
[harness.executable]
identity = "opencode"
resolver_kind = "PATH"
version_probe = ["--version"]
[harness.profile]
native_home = ".config/opencode"
guest_home = "/runtime/home"
config_format = "json"
payload_schema = "opencode-profile-v1"
codec = "opencode"
overlay_policy = "execution-local"
slots = ["provider", "instruction", "mcp", "skill"]
skill_target = "/runtime/home/skills/{skill_id}"
skill_env = "OPENCODE_CONFIG_DIR"
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "exec"
argv = ["opencode", "run"]
io = "stdio"
[harness.runtime]
io = "stdio"
network = "required"
terminal = "stdio"
[harness.continuation]
# 生产链的重开由驱动以 `GET /session/<id>` 完成：门观测到 `created:false`、
# `storedMessages=2`、`createsInsideReopenPhase=[]`，即同一 native session 被重开，
# 不是 Server 端重放 transcript。
kind = "native_session"
contract_id = "agent-box.opencode-continuation@1"
target_provider = "opencode-continuation"

