[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "ordessa-harness"
version = "2.0.0a1"
description = "Ordessa Harness integrations, shared contracts and runtime"
requires-python = ">=3.10"
# The Host extension API and the profile/work contracts this core imports.
# The historical `agent-box-terminal-session` dependency is dropped in the
# monorepo baseline: that plugin is not part of main (see MIGRATION-TABLE.md);
# no active import in this package referenced it.
dependencies = ["pacthold==2.0.0a1", "ordessa-server==2.0.0a1", "ordessa-server-plugin-api>=0.1.0,<1", "ordessa-harness-api==1.0.0a1", "ordessa-harness-claude-code>=0.1.0a1", "ordessa-harness-codex>=0.1.0a1", "ordessa-harness-pi>=0.1.0a1", "PyYAML>=6,<7", "tomli-w>=1,<2", "tomli>=2,<3; python_version<'3.11'"]
[project.entry-points."agent_box.plugins"]
# The entry-point group keeps its historical `agent_box.plugins` spelling on
# purpose: it is the plugin-discovery compatibility surface (order 61
# brand-rename pin) shared with external plugins and the still-running
# hd004b leg.
harness-profile-store = "ordessa_harness.entrypoints:create_profile_store"
opencode = "ordessa_harness.entrypoints:create_opencode"
hermes = "ordessa_harness.entrypoints:create_hermes"
# AU003: migrated families are admitted by their independent providers through
# the one CoreRegistry. Do not auto-discover their old execution factories.
# Existing source/data identities remain for separately tracked migration;
# removing an entry point does not migrate user data or enable a new runtime.
[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.package-data]
ordessa_harness = ["harnesses.toml", "launch-descriptors.json", "codex/*.json", "codex/*.toml", "_deployment/*.mjs"]
[tool.setuptools.packages.find]
where = ["src"]
