[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-model-provider"
version = "2.0.0a1"
description = "Ordessa Model Provider domain plugin: named provider configs, model catalog, bounded probes, next-turn selection"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pacthold==2.0.0a1",
    "ordessa-server==2.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
