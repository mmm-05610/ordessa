[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-model-provider-adapters"
version = "1.0.0a1"
description = "Ordessa model-provider brand configuration adapters (Pi/Codex/Claude Code) for the Harness C2 facet assets.model-provider"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ordessa-harness-api==1.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
