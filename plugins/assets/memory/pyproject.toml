[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-memory"
version = "1.0.0a1"
description = "Ordessa memory domain: mem0 self-hosted provisioning, capture and injection (facet assets.memory)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ordessa-harness-api==1.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
