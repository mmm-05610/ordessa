[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-runtime-preferences-adapters"
version = "1.0.0a1"
description = "Ordessa runtime-preferences brand configuration adapters (pi/codex/claude-code/hermes/opencode/dsh/qwen/kilo) for the Harness C2 facet assets.runtime-preferences"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ordessa-harness-api==1.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
