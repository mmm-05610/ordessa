[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-prompts"
version = "2.0.0a1"
description = "Ordessa Prompts domain plugin: supplemental instructions, personas, native system-prompt replacements"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ordessa-server-plugin-api>=0.1.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
