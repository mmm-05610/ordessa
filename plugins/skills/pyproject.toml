[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-skills"
version = "2.0.0a1"
description = "Ordessa Skills domain: versioned skill content, bounded import, auditable projection"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pacthold==2.0.0a1",
    # Product storage facade + runtime-artifact digest moved out of
    # `pacthold` here at specs/010 T009 (see tests/test_dependency_direction.py
    # PLATFORM_MODULE_GRANTS for the exact module surface).
    "pacthold-runtime-compat>=0.1.0,<1",
    "PyYAML>=6,<7",
    "ordessa-server-plugin-api>=0.1.0,<1",
    # The published Harness v2 contract (specs/011-plugin-rollout/checkpoints/
    # harness-api.json): the DTO surface the skills configuration adapters
    # implement and register against.
    "ordessa-harness-api>=1.0.0a1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The assets.skills facet registration is an optional composition edge
# (contracts.md §Profile: 可选注册不能反转依赖) — the package imports
# `ordessa_profile.contracts` lazily and runs without it.
profile = ["ordessa-profile>=2.0.0a1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
