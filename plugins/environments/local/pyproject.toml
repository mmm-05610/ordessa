[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-environments-local"
version = "0.1.0"
description = "Local isolation=none execution environment provider"
requires-python = ">=3.10"
dependencies = ["ordessa-environments==0.1.0", "ordessa-infrastructure==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
