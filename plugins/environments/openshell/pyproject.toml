[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-environments-openshell"
version = "0.1.0"
description = "OpenShell resource and non-PTY execution environment provider"
requires-python = ">=3.11"
dependencies = ["ordessa-environments==0.1.0", "openshell==0.1.3", "grpcio>=1.78.0", "protobuf>=6.31.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
