[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-server-compat"
version = "2.0.0a1"
description = "Ordessa Server compatibility core: the not-yet-split business domains behind the plugin boundary"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pacthold==2.0.0a1",
    "ordessa-server==2.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
    "ordessa-workspace==2.0.0a1",
    "ordessa-harness==2.0.0a1",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "wsproto>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]
