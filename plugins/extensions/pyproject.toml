[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-extensions"
version = "1.0.0a1"
description = "Ordessa executable-extensions domain: hook definitions, mandatory approval chain, hashed/pinned content, brand projection"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ordessa-server-plugin-api>=0.1.0,<1",
    # The published Harness v2 contract (specs/011-plugin-rollout/checkpoints/
    # harness-api.json): the DTO surface the hooks configuration adapters
    # implement and register against.
    "ordessa-harness-api>=1.0.0a1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
