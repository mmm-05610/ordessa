[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-server-product"
version = "2.0.0a1"
description = "Ordessa default Server product: the deployment's plugin selection and composition mapping"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["ordessa-infrastructure==0.1.0", "ordessa-execution-agents==0.1.0", "ordessa-units==0.1.0", "ordessa-execution-api==0.1.0", "ordessa-server==2.0.0a1", "ordessa-server-plugin-api>=0.1.0,<1", "ordessa-harness-pi==0.1.0a1", "ordessa-engineering==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."ordessa.server_product"]
default = "ordessa_server_product.composition:create_composition"

[tool.setuptools.packages.find]
where = ["src"]
