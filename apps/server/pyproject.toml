[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-server"
version = "2.0.0a1"
description = "Ordessa Server: wire/1 API, approvals, and ACP channel orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["ordessa-infrastructure==0.1.0",
    "ordessa-agents==0.1.0",
    "ordessa-environments==0.1.0",
    "ordessa-server-plugin-api>=0.1.0,<1",
    "ordessa-interfaces==0.1.0", "ordessa-interfaces-contracts==0.1.0", 
    "ordessa-decision==0.3.0",
    "SecretStorage==3.5.0; sys_platform == 'linux'",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "wsproto>=1.2,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# The retired / pending-redesign upper assembly. It is NOT part of the lower
# closure: nothing here may add a consumer. Deleted with U-01/U-02.
upper = ["ordessa-units==0.1.0", "ordessa-engineering==0.1.0",
         "ordessa-system-access-bindings==0.1.0"]
dev = ["pytest>=7", "httpx>=0.28", "pytest-asyncio"]
agents = ["ordessa-agents==0.1.0"]
decision = ["ordessa-agents==0.1.0", "ordessa-decision==0.3.0"]

[project.scripts]
ordessa-server = "ordessa_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_server = ["bootstrap/migrations/agent_box_legacy/*.sql", "bootstrap/migrations/historical_core/*.sql", "composition/bridges/subagent_stdio.mjs", "composition/native_channels/access_entry.mjs", "composition/native_channels/controlled-peers.mjs", "composition/native_channels/launch_catalog.mjs", "composition/native_channels/launch_policy.mjs", "composition/native_channels/native_server_plan.mjs", "composition/native_channels/selected_launch_ports.mjs"]
