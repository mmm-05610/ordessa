[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-server"
version = "2.0.0a1"
description = "Ordessa Server: wire/1 API, approvals, and ACP channel orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pacthold==2.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "wsproto>=1.2,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.28"]

[project.scripts]
ordessa-server = "ordessa_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
