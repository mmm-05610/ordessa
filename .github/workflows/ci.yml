# CI — the two status-check contexts the "main" ruleset requires: `backend`,
# `frontend` (job names ARE the context IDs the ruleset references).
#
# Scope honesty: the gating steps run the suites that are GREEN in this tree.
# The known-red ledgers stay registered in docs/known-issues.md and remain
# visible — every non-gating suite runs in the `ledger` step below with
# `continue-on-error`, and plain `pytest` / `npm test` locally always show the
# full picture. Nothing here deletes an assertion or hides a failure.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The install order is the R0 sequence the 014/015/016 reports verified:
      # storage-providing dists must be editable-installed before products/server
      # resolves them (otherwise pip looks for them on PyPI).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/server/lockfiles/server-linux-py312.txt
          pip install -e 'packages/pacthold[dev]' -e packages/server-plugin-api -e plugins/harness/api
          pip install -e plugins/assets/sandbox/api -e plugins/assets/sandbox/backend \
                      -e plugins/assets/sandbox/adapters -e plugins/permissions/api \
                      -e plugins/permissions/backend -e plugins/permissions/adapters
          pip install -e 'apps/server[dev]' -e 'plugins/harness[dev]' -e plugins/workspace \
                      -e plugins/runtime-compat -e plugins/server-compat \
                      -e plugins/assets/model-provider/server -e plugins/assets/model-provider/adapters \
                      -e plugins/assets/model-provider/profile-contribution -e plugins/assets/prompts \
                      -e plugins/assets/memory -e plugins/assets/extensions -e plugins/assets/skills \
                      -e plugins/assets/subagents -e plugins/assets/mcp \
                      -e plugins/assets/command-templates -e plugins/profile
          pip install -e products/server
      - name: Kernel
        run: pytest -q packages/pacthold/tests
      - name: server-compat
        run: pytest -q plugins/server-compat/tests
      - name: model-provider
        run: pytest -q plugins/assets/model-provider/server/tests
      # tests/install/ is the npm-closure / environment-sensitive area: its two
      # REGISTERED inherited reds (docs/known-issues.md: `@agentclientprotocol/sdk`
      # override vs the pi-acp declaration) fail locally and raise setup errors on a
      # clean runner. The gate excludes the directory; the ledger step runs it in full
      # so the state stays visible.
      - name: harness (green set; tests/install excluded, see ledger)
        run: pytest -q plugins/harness --ignore=plugins/harness/tests/install
      - name: "Ledger — registered known-red suites stay visible (non-gating)"
        continue-on-error: true
        run: |
          echo "== apps/server (known ledger: ~45 failed + 2 errors)"
          pytest -q apps/server/tests 2>&1 | tail -5
          echo "== tests/integration/acp_orchestration (known ledger: 18 failed)"
          pytest -q tests/integration/acp_orchestration 2>&1 | tail -5
          echo "== plugins/harness (full, incl. tests/install)"
          pytest -q plugins/harness 2>&1 | tail -3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      # The green gate list, taken from the repo's own aggregator
      # (`npm test`) — each entry passed in the tree this workflow lands on.
      # Suites outside this list are either known-red ledgers or need a display
      # for Electron; the aggregator keeps all of them visible locally.
      - name: Workspace suites
        run: |
          # apps/desktop and packages/workbench are build-coupled gates (their suites
          # read a real dist); they belong to the desktop/packaging workflow, not here.
          set -e
          for ws in \
            packages/desktop-platform/connections \
            packages/desktop-platform/extension-host \
            packages/desktop-platform/native-bridge \
            packages/desktop-platform/ui \
            packages/desktop-platform/ui-components \
            plugins/agent/connections \
            plugins/agent/sessions \
            plugins/assets/model-provider/chat-contribution \
            plugins/assets/model-provider/desktop \
            plugins/assets/sandbox/frontend \
            plugins/assets/subagents/settings \
            plugins/assets/subagents/ui \
            plugins/chat/api \
            plugins/chat/frontend \
            plugins/connectors/acp \
            plugins/connectors/ordessa \
            plugins/permissions/frontend \
            plugins/profile/api \
            plugins/profile/frontend \
            plugins/profile/integrations/chat ; do
            echo "== $ws"; npm test --workspace "$ws"
          done
