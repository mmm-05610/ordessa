schema_version: 1
question_set_id: output-scope
question_set_version: 1.0.0
input_mapping_version: 1.0.0
input_contract: SubmissionOutputScopeInput.v1
required_input_slots:
- submission_ref
- fixed_delivery_refs
- executor_report
- independent_review_observations
iteration: once
questions:
- question_id: output_scope
  question_revision: 1.0.0
  kind: choice
  criterion_refs:
  - resource: standard.acceptance
    criterion_id: output_scope
  instructions: 独立判断固定交付引用及基线下的输出是否符合已批准范围。只依据冻结交付、执行者报告和独立审核观察；引用存在或执行者自述本身不能证明范围符合。材料缺失、版本不明或观察不足时不得回答supported。
  answer_definition:
    from_criterion:
      resource: standard.acceptance
      criterion_id: output_scope
    field: answer_vocabulary
result_contract: DecisionResult.v1
truncation_policy: reject
missing_required_evidence: do_not_invoke
