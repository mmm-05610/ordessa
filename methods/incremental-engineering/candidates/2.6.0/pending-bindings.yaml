action_permissions:
  generate_package: exact generate_package Grant required by original freeze, not
    implied by DID acceptance
  implement: exact real dispatch/checkout/write/test actions and scope under current
    original Grant
  adopt: exact target CAS adoption authority, review pass is not permission
no_unnecessary_confirmation: Reuse already valid exact action permission when original
  owner verifies target/scope/current controls. Missing action permission uses genuine
  existing confirmation; no vague consent.
unit_submission_review_contract:
  status: unsupported
  original_types_to_reuse:
  - SubmissionRef
  - ArtifactRevisionRef
  - ReviewRequirement
  - CheckKey
  - ReviewPlan
  pending_fields:
  - generic structured Unit submit input/result/version/digest
  - original Unit/work/step/attempt and source correlation
  - immutable accepted delivery and pending-review readback
  - original reviewer Unit role/independence guard
  - complete requirements/check-key/response admission
  - original Work current gate/CAS rework/resume
  fixture_always_pass: not_production_review
  fixed_reference_types:
  - commit
  - snapshot
  - artifact
  host_capture_all_files_tests_effects_required: false
  host_verified_test_fact_production_required: false
method76_bindings:
  policy_status: candidate_declaration_only_production_sources_unqualified
  ordinary_rework:
    maximum_rounds: 2
    choice: first_method_explicit_bound_original_attempt_plus_one_admitted_correction
    not_historical_authorization_or_core_default: true
    exhaustion: revision_required
    important_design_change: return_to_DID_proposal_under_existing_policy
    unknown_external_effect: reconcile_before_retry_never_loop
    truth_check_owner: independent review Unit under original admission
    author_reviewer_independence: method policy through the generic host identity constraints
    source_semantics: asserted executor report vs actually independently verified facts
    source_and_guard_requirements:
    - exact approved DID ref and fixed content/version
    - exact frozen package ref and fixed content/version
    - original SubmissionRef and authored report
    - original acceptance ReviewRecord and complete request/plan correlation
    - immutable correction-plan ArtifactRevisionRef and exact schema-valid content
    - correction-plan embedded failed SubmissionRef/ReviewRef equal original records
    - original failed ReviewRecord cross-checked to completed command result, exact plan digest, request version and fence
    - each correction row's failed CheckKey and target exactly belongs to the complete original ReviewPlan and its recorded observations; this identifies the failed item and does not narrow or substitute the correction-eligibility criterion
    - independent generic Decision result under the original full ReviewPlan and current source guards through COMMIT
    - current original implementation permission before each new execution
    - current action Grant and remaining budget for the same exact frozen package; never reuse spent budget or replace its authorization refs
    - if that package cannot authorize another attempt, refuse advancement until a separately authorized newly frozen package is available; no automatic package renewal in this loop
    - new exact report/SubmissionRef and fresh independent review for every correction
    semantic_gate:
      capability_id: ordessa.decision.evaluate
      question_set: decision.rework_scope
      subject_document_type: correction-plan
      subject_ref_kind: artifact_revision
      review_purpose: quality
      actual_generic_route: available_but_production_reviewer_source_unqualified
      nominal_answer_contract: ordessa.nominal-choice-status/1
      unknown_answer_policy: manual_or_reject_under_original_owner_contract
      no_threshold_or_confidence_policy_added: true
      answers_are_not_grants: true
  new_waits:
  - step_id: await_acceptance_response
    required_source: original current requested acceptance review response envelope; exact review_id, request_version, fence and raw_response_utf8; correlate to acceptance_review_plan and submission_ref
    status: unsupported
  - step_id: await_rework_review_plan
    required_source: original current work source reads an immutable schema-valid correction-plan ArtifactRevisionRef, verifies its embedded approved DID/package/failed SubmissionRef/failed ReviewRef against current records, and correlates that ReviewRecord to its completed command result, exact plan digest, request version and fence before constructing the full quality ReviewPlan
    status: unsupported
  - step_id: await_rework_review_response
    required_source: original current requested rework-scope response envelope; exact review_id, request_version, fence and raw_response_utf8; correlate to rework_review_plan, exact correction_plan_ref, failed ReviewRecord and source submission
    status: unsupported
adoption_input_bindings:
  wait_step: await_adoption_permission
  source_fields:
    submission_ref: existing exact context slot, matched to current acceptance closure
    approval_ref: event.approval_ref, current original action authority; not supplied by a review
    expected_control_version: event.expected_control_version, from current original authority source
    targets: event.targets, exact target_ref and expected artifact/version/head CAS values from the current original source
  result_binding:
    operation_result_field: acceptance_receipt_ref
    wait_projection_field: event.acceptance_receipt_ref
    status: original owner readback/correlation still required
  outputs_are_projection_only: true
