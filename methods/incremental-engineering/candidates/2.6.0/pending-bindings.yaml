work_input_truth_boundary: values are method data only; original same-library source must independently resolve exact refs/plans/grants/results; dispatch_input does not mean permission granted
review_response_boundary: exact same-authority BlobRef is decoded through original BlobStore; arbitrary inline raw response text is rejected
requires_include_exact_detached_descriptors_not_production_registration: true
available_detached_operation_descriptors:
- capability_id: engineering.packages.freeze
  source: EngineeringService.operation_capabilities
  interface_version: '1'
  contract_digest: 4b4b09d58c55facfb770a6974590bea8a1212d21e3419ce471d712f3ff222d9b
- capability_id: engineering.executions.dispatch
  source: conditional owner_capabilities descriptor; requires execution-dispatch composition
  interface_version: '1'
  contract_digest: ddf76600cd07aaab2051d180b441405438abf8d78a6aa2c650fdc5a3c1ed92d7
- capability_id: engineering.submissions.record_report
  source: EngineeringService.operation_capabilities
  interface_version: '1'
  contract_digest: 208580b13ec6d100f16d1f3b6f8cdf2cec03800140d904908747242e821b3df0
operation_source_gaps:
- operation: engineering.packages.freeze
  wait_step: await_generate_package_permission
  required_source: exact closed ImplementationPackage record plus current draft/method binding
- operation: engineering.executions.dispatch
  wait_step: await_implementation_permission
  required_source:
  - dispatch.run_id
  - dispatch.step_id
  - dispatch.attempt
  - dispatch.unit_ref
  - dispatch.params
  - dispatch.actions
  - dispatch.timeout
  unresolved: method declares dispatch_input in the versioned work-input document; production source selection and original dispatch schema/current Grant qualification remain pending
  package_slot: package_ref
  package_slot_source_wait: await_frozen_package
- operation: engineering.submissions.record_report
  wait_step: await_execution_capture
  required_source: method-bound MethodContent and fixed ArtifactRevisionRef outputs from actual Unit response
  boundary: all file/tree/test/effect fact fields empty; report remains authored and pending independent review
  source_binding: metadata.work_source.waits.await_execution_capture.native_report_slot names the exact event field; the selected original source must resolve the Submission to a same-owner Execution record/query producer and verify Unit, operation, prompt, query, blob, and completed state
  missing_or_unknown: remain waiting or refuse; never accept the work-input report field as proof of execution completion
intent_readback:
  wait_step: await_intent_ref
  source: original same-library authorization repository get_intent(intent_id)
  event_fields: {id: intent_id, digest: intent_digest}
  required_match: exact method reference and intent digest from the resolved original intent
  missing_or_mismatch: remain waiting or refuse; work-input values alone are not authorization evidence
result_mapping_gaps:
- operation: engineering.executions.dispatch
  owner_outcomes: [completed, failed, unknown]
  result_consumer: engineering.work.record_dispatch_step
  source: packages/engineering/src/ordessa_engineering/application/orchestration/native_step.py::record_dispatch_step
  implemented_mapping: reads and verifies the original terminal dispatch row/result; completed/failed are routed from the canonical original dispatch result and appended with the method step log/cursor update in the same UoW/CAS path
  unknown_behavior: rejected with WORK_OPERATION_OUTCOME_UNKNOWN before routing or step advancement; never coerced to the candidate's terminal unknown stop outcome
  unresolved_runtime: no production native catalog registration for engineering.executions.dispatch; opaque event.dispatch_input still lacks an authoritative source binding; candidate unknown branch cannot be reached through record_dispatch_step
