  current_owner_evidence: descriptor maps to original graph validator and exact same-UoW source correlation; complete positive Submission case has not been qualified
  minimum_closure: production registration and positive Submission source qualification; preserve original graph invariants and correlation to full review request/CheckKey. Do not remove or weaken the criterion.
semantic_decision_mappings:
  capability_id: ordessa.decision.evaluate
  interface_version: '1.0.0'
  result_contract: DecisionResult.v1
  candidate_question_sets:
  - criterion_id: output_scope
    resource: decision.output_scope
    input_slots: [submission_ref, fixed_delivery_refs, executor_report, independent_review_observations]
  - criterion_id: test_evidence
    resource: decision.test_evidence
    input_slots: [submission_ref, fixed_delivery_refs, executor_report, independent_review_observations, acceptance_mapping]
  - criterion_id: intent_binding
    resource: decision.intent_binding
    input_slots: [proposal_ref, implementation_intent, method_content]
  - criterion_id: semantic_consistency
    resource: decision.change_consistency
    question_id: coverage
    input_slots: [proposal_ref, method_content, source_captures]
    question_set_version: 2.0.0
    answer_kind: choice
    nominal_answer_contract: ordessa.nominal-choice-status/1
    option_statuses: {conflicting: violated, partial: insufficient, complete: satisfied}
  - criterion_id: semantic_drift
    resource: decision.change_consistency
    question_id: drift
    input_slots: [proposal_ref, method_content, source_captures]
    question_set_version: 2.0.0
    answer_kind: choice
    nominal_answer_contract: ordessa.nominal-choice-status/1
    option_statuses: {drift_detected: violated, no_drift_detected: satisfied}
  result_rules:
    supported: satisfied
    contradicted: violated
    insufficient: insufficient
    tie_missing_incomplete_truncated_or_unmapped: unknown
    semantic_consistency_options: {conflicting: violated, partial: insufficient, complete: satisfied}
    semantic_drift_options: {drift_detected: violated, no_drift_detected: satisfied}
    status_mapping: apply_exact_selected_method_criterion_disposition_after_current_source_and_evidence_guards
    missing_evidence: do_not_invoke
    unknown_is_never_pass: true
  calibration: no score/Noul numeric conversion or thresholds; semantic policy uses explicit finite Choice options under the existing v1 contract; production source/reviewer qualification remains pending
  implementation_boundary: Engineering preserves/correlates exact request, frozen method/material refs and source records; Decision evaluates method-selected semantic questions; standards remain external policy
