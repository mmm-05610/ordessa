- id: await_package_gate
  kind: wait
  event: engineering.work.current_condition
  bind: {}
  next: await_implementation_permission
  match:
    plan: package_review_plan
    package: package_ref
    method: method_ref
- id: await_implementation_permission
  kind: wait
  event: engineering.work.current_condition
  bind:
    dispatch_input: event.dispatch_input
  next: dispatch
  match:
    package: package_ref
    method: method_ref
- id: dispatch
  kind: operation
  operation: engineering.executions.dispatch
  inputs:
    dispatch: dispatch_input
  outcomes:
    completed:
      next: await_execution_capture
    failed:
      next: await_execution_capture
    unknown:
      stop: unknown
  config:
    package_slot: package_ref
- id: await_execution_capture
  kind: wait
  event: engineering.work.current_condition
  bind:
    submission_record: event.submission_record
  next: record_submission
  match:
    package: package_ref
    method: method_ref
