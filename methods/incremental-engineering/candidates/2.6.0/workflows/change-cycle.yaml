    apply_receipt_ref: event.apply_receipt_ref
  next: await_package_draft
  match:
    approval: document_approval_ref
    proposal: proposal_ref
    baseline: baseline_ref
    method: method_ref
- id: await_package_draft
  kind: wait
  event: engineering.work.current_condition
  bind:
    package_draft_ref: event.package_draft_ref
  next: await_generate_package_permission
  match:
    did: applied_did_ref
    receipt: apply_receipt_ref
    method: method_ref
- id: await_generate_package_permission
