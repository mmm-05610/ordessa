      - await_submission
      - acceptance_review
      - await_acceptance_gate
      - await_adoption_permission
      - adopt
      fact_provenance:
        executor_report: asserted
        independent_review: record what was checked, against which fixed version,
          by which Unit, with which evidence; only actually independently checked
          facts can be marked verified
        unverified_test_fact: retain asserted, do not require host to manufacture
          verified observations
        review_result_and_verified_fact_are_distinct: true
        references_or_role_labels_do_not_upgrade_truth: true
      applies_when: Unit-authored delivery at an original Work step requiring the
        declared method review; standards/requirements selected by its exact phase,
        not universal acceptance criteria on all deliveries
      review_output:
        document_type: unit-review-result
        schema_version: 1
        schema_resource: document.unit_review_result.schema
        codec_contract: ordessa.incremental-engineering.unit-review-result/1
        consumer_owner: original Engineering orchestration/unit_review; Product binds
          original recorded source
        answer_type: original CriterionAnswer
        complete_keys: each exact Plan CheckKey once; missing/duplicate/extra/wrong
          keys reject
        plan_digest: exact original Plan digest, mismatch reject
        unknown: retain unknown through original admission, never coerce to satisfied
        identity_and_quality: original source/current guards and method-declared per-criterion policy; never body fields
    submission_ingress: generic_unit_result_pending_review_contract_pending_not_heavy_implementation_capture_admission
    review_output_document:
      schema:
        resource: document.unit_review_result.schema
      template:
        resource: document.unit_review_result.template
- id: await_submission
  kind: wait
  event: engineering.work.current_condition
  bind:
    submission_ref: event.submission_ref
    acceptance_review_plan: event.acceptance_review_plan
  next: acceptance_review
- id: acceptance_review
  kind: operation
  operation: engineering.reviews.request
  inputs:
    plan: acceptance_review_plan
  outcomes:
    completed:
      next: await_acceptance_response
    rejected:
      stop: revision_required
  config:
    review_source:
      response_document_type: unit-review-result
      response_schema:
        resource: document.unit_review_result.schema
      response_codec: exact_check_key_status/1
    standards:
    - resource: standard.acceptance
    purpose: acceptance
    completion: requested_not_passed
    unit_submission_review_strategy:
      schema_version: 1
      policy_id: ordessa.incremental-engineering.unit-submission-review
      policy_revision: 1
      declaration_kind: method_strategy_not_host_capability_or_authorization
      consumer_status: unsupported_until_original_owner_binding
      fixed_delivery:
        author_result_schema: document.submission.schema
        author_result_schema_version: 2
        submission_ref_owner: original Engineering submission owner
        target_ref_types:
        - pinned commit locator
        - original RepositorySnapshotRef
        - original ArtifactRevisionRef
        - original SubmissionRef after submission
        resolution: exact_revision_and_digest_never_latest
        pending_review_is_not_pass: true
        unit_result_is_declaration_not_source_proof: true
        capture_all_files_tests_effects_before_submit: false
        host_obligation: preserve fixed reference/source/Unit-result correlation;
          no universal host truth verification
        independent_truth_check_owner: selected independent review Unit under this
          method
      roles:
        author: selected_executor_unit
        reviewer: independent_review_unit
        selection_authority: original host generic identity matching/constraint mechanism,
          driven by this method policy
        identity_constraint: original_author_unit_identity_must_differ_from_original_reviewer_unit_identity
        self_declared_role_is_not_authentication: true
        semantic_judge: method-bound Decision answers through the selected independent review; no separate matching-evaluation gate
        mechanical_checks: original reference/source integrity as applicable; no requirement
          that host produce all verified test/output/effect facts
        independence_scope: this method only, not hardcoded for all methods
      review_requirements:
        owner_expansion: original MethodBridge with trusted phase/targets
        set: all_applicable_required_criteria_and_all_declared_claims
        key: original CheckKey(target,criterion_id,claim_id)
        reviewer_cannot_select_subset: true
        empty_applicable_set: error
        no_claim_kind_or_missing_evidence_exemption: true
        acceptance_criteria:
        - submission_shape
        - submission_binding
        - output_scope
        - test_evidence
        status_dispositions:
          satisfied: pass
          violated: block
          insufficient: block
          unknown: manual
        new_na_or_quality_override_rules: false
      rework:
        new_delivery: new exact ArtifactRevisionRef and original SubmissionRef, retain
          old source/submission/review facts
        old_review_reuse: forbidden_for_changed_target_or_requirement
        important_design_gap: return_to_DID_proposal
        ordinary_fix: within_existing_exact_valid_scope; original owner reconciles
          new attempt
        unknown_external_effect: reconcile_before_retry
      acceptance:
        gate: all required current trusted exact-target reviews and mechanical evidence
          satisfied
        reported_complete_not_gate: true
        independent_unit_identity_required: true
        real_tests_output_scope_submission_binding_required: true
        adoption: original exact current action authority and target CAS; review is
          not Grant
        missing_binding: unsupported_do_not_advance
        truth_check_owner: independent review Unit; system records source and asserted/verified
          status accurately
      workflow_nodes:
      - source_review
      - quality_review
      - package_review
      - await_execution_capture
      - record_submission
      - await_submission
      - acceptance_review
      - await_acceptance_gate
      - await_adoption_permission
      - adopt
      fact_provenance:
        executor_report: asserted
        independent_review: record what was checked, against which fixed version,
          by which Unit, with which evidence; only actually independently checked
          facts can be marked verified
        unverified_test_fact: retain asserted, do not require host to manufacture
          verified observations
        review_result_and_verified_fact_are_distinct: true
        references_or_role_labels_do_not_upgrade_truth: true
      applies_when: Unit-authored delivery at an original Work step requiring the
        declared method review; standards/requirements selected by its exact phase,
        not universal acceptance criteria on all deliveries
      review_output:
        document_type: unit-review-result
        schema_version: 1
        schema_resource: document.unit_review_result.schema
        codec_contract: ordessa.incremental-engineering.unit-review-result/1
        consumer_owner: original Engineering orchestration/unit_review; Product binds
          original recorded source
        answer_type: original CriterionAnswer
        complete_keys: each exact Plan CheckKey once; missing/duplicate/extra/wrong
          keys reject
        plan_digest: exact original Plan digest, mismatch reject
        unknown: retain unknown through original admission, never coerce to satisfied
        identity_and_quality: original source/current guards and method-declared per-criterion policy; never body fields
    review_output_document:
      schema:
        resource: document.unit_review_result.schema
      template:
        resource: document.unit_review_result.template
- id: await_acceptance_response
  kind: wait
  event: engineering.work.current_condition
  bind:
    acceptance_review_id: event.review_id
    acceptance_request_version: event.request_version
    acceptance_review_fence: event.fence
    acceptance_raw_response_utf8: event.raw_response_utf8
  next: record_acceptance_review
  match:
    plan: acceptance_review_plan
    submission: submission_ref
    method: method_ref
- id: record_acceptance_review
  kind: operation
  operation: engineering.reviews.record
  inputs:
    review_id: acceptance_review_id
    request_version: acceptance_request_version
    fence: acceptance_review_fence
    raw_response_utf8: acceptance_raw_response_utf8
  outcomes:
    completed:
      next: await_acceptance_gate
    rejected:
      stop: revision_required
  result_routing:
    path: /verdict
    outcomes:
      pass:
        next: await_acceptance_gate
      fail:
        next: await_rework_review_plan
      indeterminate:
        stop: unknown
- id: await_acceptance_gate
  kind: wait
  event: engineering.work.current_condition
  bind: {}
  next: await_adoption_permission
  match:
    plan: acceptance_review_plan
    submission: submission_ref
    method: method_ref
- id: await_rework_review_plan
  kind: wait
  event: engineering.work.current_condition
  bind:
    acceptance_review_ref: event.review_ref
    acceptance_record_plan_digest: event.plan_digest
    acceptance_record_request_version: event.request_version
    acceptance_record_fence: event.fence
    correction_plan_ref: event.correction_plan_ref
    correction_plan_content: event.correction_plan_content
    rework_review_plan: event.review_plan
  next: rework_review
  match:
    submission: submission_ref
    acceptance_request_id: acceptance_review_id
    acceptance_review: acceptance_review_ref
    acceptance_plan_digest: acceptance_record_plan_digest
    acceptance_request_version: acceptance_record_request_version
    acceptance_fence: acceptance_record_fence
    correction_plan: correction_plan_ref
    did: applied_did_ref
    package: package_ref
    method: method_ref
- id: rework_review
  kind: operation
  operation: engineering.reviews.request
  inputs:
    plan: rework_review_plan
  outcomes:
    completed:
      next: await_rework_review_response
    rejected:
      stop: revision_required
  config:
    review_source:
      response_document_type: unit-review-result
      response_schema:
        resource: document.unit_review_result.schema
      response_codec: exact_check_key_status/1
    standards:
    - resource: standard.rework_scope
    purpose: quality
    completion: requested_not_passed
- id: await_rework_review_response
  kind: wait
  event: engineering.work.current_condition
  bind:
    rework_review_id: event.review_id
    rework_request_version: event.request_version
    rework_review_fence: event.fence
    rework_raw_response_utf8: event.raw_response_utf8
  next: record_rework_review
  match:
    plan: rework_review_plan
    correction_plan: correction_plan_ref
    submission: submission_ref
    acceptance_review: acceptance_review_ref
    method: method_ref
- id: record_rework_review
  kind: operation
  operation: engineering.reviews.record
  inputs:
    review_id: rework_review_id
    request_version: rework_request_version
    fence: rework_review_fence
    raw_response_utf8: rework_raw_response_utf8
  outcomes:
    completed:
      next: await_implementation_permission
    rejected:
      stop: revision_required
  result_routing:
    path: /verdict
    outcomes:
      pass:
        next: await_implementation_permission
      fail:
        stop: revision_required
      indeterminate:
        stop: unknown
- id: await_adoption_permission
  kind: wait
  event: engineering.work.current_condition
  bind:
    adoption_approval_ref: event.approval_ref
    adoption_control_version: event.expected_control_version
    adoption_intent_id: event.intent_id
    adoption_targets: event.targets
  next: adopt
  match:
    submission: submission_ref
    method: method_ref
- id: adopt
  kind: operation
  operation: engineering.acceptance.adopt
  inputs:
    submission_ref: submission_ref
    approval_ref: adoption_approval_ref
    expected_control_version: adoption_control_version
    targets: adoption_targets
  outcomes:
    completed:
      next: await_adoption_receipt
    rejected:
      stop: revision_required
  config:
    availability: unsupported_contract_not_bound
    provisional_inputs_outcomes: true
- id: await_adoption_receipt
  kind: wait
  event: engineering.work.current_condition
  bind:
    adoption_ref: event.acceptance_receipt_ref
  next: await_feedback
  match:
    submission: submission_ref
    method: method_ref
- id: await_feedback
  kind: wait
  event: engineering.work.current_condition
  bind:
    feedback_ref: event.feedback_ref
  next: accepted
  match:
    adoption: adoption_ref
    submission: submission_ref
- id: accepted
  kind: stop
  outcome: accepted
stop_outcomes:
- accepted
- revision_required
- rejected
- unknown
- cancelled
outputs:
  submission_ref: submission_ref
  adoption_ref: adoption_ref
loops:
- loop_id: implementation-rework
  from_step: record_rework_review
  to_step: await_implementation_permission
  max_rounds: 2
  on_exhausted: revision_required
wait_kinds:
- owner_reconciliation
cancellation: authenticated_request_then_reconcile_external_effects
revision_restart: explicit_new_epoch_with_exact_new_proposal
automatic_side_effect_retry: forbidden_when_outcome_unknown
