  outcomes:
    completed:
      next: await_intent_ref
    rejected:
      stop: revision_required
  config: {}
- id: await_intent_ref
  kind: wait
  event: engineering.work.current_condition
  bind:
    intent_id: event.intent_id
    intent_digest: event.intent_digest
  next: request_approval
- id: request_approval
  kind: operation
  operation: engineering.approvals.request
  inputs:
    intent_id: intent_id
    intent_digest: intent_digest
  outcomes:
    completed:
      next: await_document_acceptance
    rejected:
      stop: revision_required
  config:
    completion: pending_challenge_not_grant
- id: await_document_acceptance
  kind: wait
  event: engineering.work.current_condition
  bind:
    document_approval_ref: event.document_approval_ref
  next: apply_did
  match:
    intent_id: intent_id
    intent_digest: intent_digest
    proposal: proposal_ref
    baseline: baseline_ref
    method: method_ref
- id: apply_did
