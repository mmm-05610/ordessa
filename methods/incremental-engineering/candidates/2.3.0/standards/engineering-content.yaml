schema_version: 1
standard_id: engineering-content
revision: 2.0.0
purpose: quality
criteria:
- criterion_id: selected_standard_content
  statement: 每一选定标准适用条款均有实质内容证据，裁剪有有效接受；无标准正文/配置/裁剪授权不能通过。
  applies_to:
  - did-change
  required_inputs:
  - proposal_ref
  - baseline_ref
  - standard_profile_ref
  - method_content
  - source_captures
  checks:
  - capability_id: ordessa.decision.evaluate
    interface_version: 1.0.0
    bindings:
      question_set:
        resource: decision.engineering_content
      question_ids:
      - selected_standard_content
  policy:
    satisfied: manual
    violated: block
    insufficient: block
    unknown: manual
  answer_vocabulary:
    kind: choice
    options:
    - option_id: supported
      description: 完整满足冻结问题；意见仍交受信审阅者复核，不产生权限。自动判定准入另需已接受评测。
    - option_id: contradicted
      description: 与有效约束或目标冲突。
    - option_id: insufficient
      description: 有缺口或上下文不足，不能确定。
- criterion_id: change_impact_completeness
  statement: 逐条增改删及受影响保持项覆盖owner、接口、消费者、装配、数据、错误/失败、权限、验证与迁移退役；不适用有证据，重要未知阻塞，不要求用户补普通已授权实现细节。
  applies_to:
  - did-change
  required_inputs:
  - proposal_ref
  - baseline_ref
  - standard_profile_ref
  - method_content
  - source_captures
