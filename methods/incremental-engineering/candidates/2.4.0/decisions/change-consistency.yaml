schema_version: 1
question_set_id: change-consistency
question_set_version: 1.0.0
input_mapping_version: 1.0.0
input_contract: ProposalConsistencyInput
required_input_slots:
- proposal
- did
- captured_sources
- resolved_criteria
iteration: once
questions:
- question_id: coverage
  question_revision: 1.0.0
  kind: score
  criterion_refs:
  - resource: standard.quality_review
    criterion_id: semantic_consistency
  instructions: 根据冻结要求与方案，按引用标准的等级评价覆盖程度。
  answer_definition:
    from_criterion:
      resource: standard.quality_review
      criterion_id: semantic_consistency
    field: answer_vocabulary
- question_id: drift
  question_revision: 1.0.0
  kind: noul
  criterion_refs:
  - resource: standard.quality_review
    criterion_id: semantic_drift
  instructions: 只判断引用标准定义的命题。该回答不证明批准，不替代范围校验。
  answer_definition:
    from_criterion:
      resource: standard.quality_review
      criterion_id: semantic_drift
    field: answer_vocabulary
result_contract: DecisionResult.v1
truncation_policy: reject
evidence_order: source_id_then_selector
missing_required_evidence: do_not_invoke
