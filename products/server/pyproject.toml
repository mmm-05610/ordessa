[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-server-product"
version = "2.0.0a1"
description = "Ordessa default Server product: the deployment's plugin selection and composition mapping"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ordessa-server==2.0.0a1",
    "ordessa-server-plugin-api>=0.1.0,<1",
    "ordessa-server-compat==2.0.0a1",
    "ordessa-workspace==2.0.0a1",
    "ordessa-harness==2.0.0a1",
    "ordessa-harness-api==1.0.0a1",
    "ordessa-sandbox-backend==0.1.0",
    "ordessa-sandbox-adapters==0.1.0",
    "ordessa-permissions-adapters==0.1.0",
    "pacthold-runtime-compat==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."ordessa.server_product"]
default = "ordessa_server_product.composition:create_composition"

[tool.setuptools.packages.find]
where = ["src"]
