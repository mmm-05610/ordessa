[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-agent-tools"
version = "0.1.0a2"
description = "Independent Ordessa Agent Tools CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ordessa-agent = "ordessa_agent_tools.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["ordessa_agent_tools.native_clients*"]

[tool.setuptools.package-data]
ordessa_agent_tools = ["schema.json", "schema-management.json", "provider-schema.json", "harness_commands.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
