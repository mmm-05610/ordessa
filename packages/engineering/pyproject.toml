[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-engineering"
version = "0.1.0"
description = "Local, versioned engineering material workflow"
requires-python = ">=3.12"
dependencies = ["ordessa-decision==0.3.0", "ordessa-infrastructure==0.1.0", "PyYAML==6.0.3", "jsonschema==4.20.0", "referencing==0.36.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio"]
execution = ["ordessa-agents==0.1.0", "ordessa-units==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_engineering = ["adapters/registry/resources/operation_registry.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../execution/decision/src"]
asyncio_mode = "auto"
