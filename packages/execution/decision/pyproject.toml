[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-runtime"
version = "0.2.0"
description = "Owned decision core: decision-job/1, rules/ask runner, evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ordessa-interfaces-contracts==0.1.0"]

[project.entry-points."ordessa.capabilities"]
decisions = "decision_runtime.capability:factory"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["decision_runtime*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
