[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-persistence-sqlite"
version = "0.1.0"
description = "SQLite persistence adapters for the open-environment StorePort/DataAreaPort (spec 026/005)"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["ordessa-environment-api"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_persistence_sqlite = ["py.typed", "migrations/*.sql"]
