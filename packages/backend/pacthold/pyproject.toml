[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacthold"
version = "2.0.0a1"
description = "Pacthold: execution governance kernel and plugin SDK for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "codex", "agent", "sandbox", "bwrap", "wsl"]
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["ordessa-environment-api", "pydantic-graph==2.54.0"]

[project.urls]
# Upstream project URLs keep the historical repository identity on purpose.
Homepage = "https://github.com/mmm-05610/agent-box"
Repository = "https://github.com/mmm-05610/agent-box"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio"]
jev = ["typesafe-sdk==0.7.2"]

[project.scripts]
pacthold = "pacthold.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pacthold = ["migrations/*.sql", "decision/flows/agent_assignment/*.json", "decision/contracts/*.json", "harness_kit/_deployment/*.mjs"]
