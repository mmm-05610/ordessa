[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-platform-services"
version = "0.1.0"
description = "Optional platform adapters: file/SQLite data areas and secret references (spec 026/005, E4)"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["ordessa-environment-api"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_platform_services = ["py.typed"]
