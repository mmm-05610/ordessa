[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "ordessa-decision"
version = "0.1.0"
description = "Read-only bounded decisions over externally defined trusted graphs"
requires-python = ">=3.10"
dependencies = ["pydantic-graph==2.54.0"]
[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.2"]
ordessa = ["pacthold==2.0.0a1", "ordessa-environment-api==0.1.0"]
dev = ["pytest", "pytest-asyncio", "build"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ordessa_decision = ["flows/agent_assignment/*.json", "contracts/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
