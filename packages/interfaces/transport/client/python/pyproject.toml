[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-system-access-client"
version = "0.1.0"
description = "Bounded, non-retrying wire/1 client for the Ordessa system-access API"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordessa_system_access_client = ["schema.json", "schema-management.json", "provider-schema.json", "sdk-contract-catalog.json"]
