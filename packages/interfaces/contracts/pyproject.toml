[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordessa-interfaces-contracts"
version = "0.1.0"
description = "Frozen F1 capability contracts (DESIGN 3.1); JSON Schema admission only."
requires-python = ">=3.12"
# The declarations are data, but admission/validation uses a pinned
# JSON Schema engine. Declaring it keeps the installed closure honest.
dependencies = ["jsonschema>=4.20,<5", "referencing==0.36.2"]

[tool.setuptools.packages.find]
where = ["src"]
